[project]
name = "github-trending-to-bluesky"
version = "0.1.0"
description = "A bot to fetch trending GitHub repositories and post them to Bluesky"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "atproto>=0.0.69",
    "beautifulsoup4",
    "dnspython",
    "google-genai",
    "packaging",
    "Pillow",
    "requests",
]

[tool.uv]
override-dependencies = [
    "cryptography>=50.0.0",
    "certifi>=2026.10.19",
]
exclude-newer = "7 days"

[tool.uv.exclude-newer-package]
certifi = false

