name: スクリプトを実行する

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'

permissions:
  contents: read
  actions: write

jobs:
  run_script:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 前回の成果物をダウンロード
        uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7 # v24
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          name: artifact
          path: ${{ runner.temp }}/artifacts
          if_no_artifact_found: ignore

      - name: 成果物を配置
        run: |
          mkdir -p tmp
          if [ -f "${{ runner.temp }}/artifacts/previous_result.txt" ]; then
            cp "${{ runner.temp }}/artifacts/previous_result.txt" tmp/previous_result.txt
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: '3.10'

      - name: 依存関係のインストール
        run: uv sync --frozen

      - name: リポジトリ内のPythonファイルを実行
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run python main.py "${BLUESKY_HANDLE}" "${BLUESKY_PASSWORD}" "${GEMINI_API_KEY}"

      - name: 成果物をアップロード
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact
          path: tmp/
          retention-days: 10
